[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitconv"
version = "0.1.0"
description = "A small command-line unit converter for length, mass, and temperature."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matt Stone" }]

[project.scripts]
unitconv = "unitconv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
