name: code-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, main]

jobs:
  code-review:
    name: code-review
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'review: fail') }}" = "true" ]; then
            echo "cli.py:12 unused import"
            echo "convert.py:44 line too long"
            exit 1
          fi
          echo "no findings"
          exit 0
